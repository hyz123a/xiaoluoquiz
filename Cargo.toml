[package]
name = "xiaoluoquiz"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[features]
default = ["server"]
server = [
    "dep:argon2",
    "dep:async-trait",
    "dep:rand",
    "dep:sha2",
    "dep:axum",
    "dep:dotenvy",
    "dep:sqlx",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
]
web = [
    "dep:gloo-net",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:yew",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
rand = { version = "0.8", optional = true }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
thiserror = "2"

argon2 = { version = "0.5", optional = true }
async-trait = { version = "0.1", optional = true }
axum = { version = "0.8", optional = true }
dotenvy = { version = "0.15", optional = true }
sqlx = { version = "0.8", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio-rustls"], optional = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"], optional = true }
tower-http = { version = "0.6", features = ["fs", "trace"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

gloo-net = { version = "0.6", features = ["json"], optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["Event", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "InputEvent", "Location", "SubmitEvent", "Window"], optional = true }
yew = { version = "0.23", features = ["csr"], optional = true }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
serde_json = "1"
tower = "0.5"

[[bin]]
name = "xiaoluoquiz-server"
path = "src/bin/server.rs"
required-features = ["server"]

[[bin]]
name = "xiaoluoquiz-import-questions"
path = "src/bin/import_questions.rs"
required-features = ["server"]

[[bin]]
name = "xiaoluoquiz-web"
path = "src/web/main.rs"
required-features = ["web"]
